services:
  # Backend Fastify API Service
  - type: web
    name: isomorph-api
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start:api
    envVars:
      - key: PORT
        value: 3000
      - key: DEMO_MODE
        value: true
      - key: NODE_ENV
        value: production

  # Frontend Static Site
  - type: web
    name: isomorph-frontend
    env: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: isomorph-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
